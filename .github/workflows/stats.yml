name: Update GitHub stats card

# The public github-readme-stats server is unreliable, so the card is built
# here once a day and committed to profile/stats.svg for the README to show.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card (with GitHub grade)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=realspinn&show_icons=true&hide=contribs&show=reviews,prs_merged&custom_title=Public%20GitHub%20activity&bg_color=141417&border_color=2c2c31&title_color=e2455f&text_color=e7e5e4&icon_color=d42a4a&ring_color=d42a4a&border_radius=12&disable_animations=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          git commit -m "Update GitHub stats card" || exit 0
          git push
