<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Israel Adeleye</title>
  <desc id="desc">Database engineering. Cloud Database Engineer · SQL safety tooling. MySQL · PostgreSQL · SQL Server.</desc>
  <style>
    .glow  { animation: breathe 5s ease-in-out infinite; }
    .light { animation: pulse 2s ease-in-out infinite; }
    .grid  { animation: drift 6s linear infinite; }
    .scan  { animation: scan 7.5s ease-in-out infinite; }
    .pill  { animation: risk 7.5s ease-in-out infinite; }
    .caret { animation: blink 1s steps(1) infinite; }
    .shine { animation: shine 4.5s ease-in-out infinite; }
    .pkt   { animation: flow 3.6s linear infinite; }
    .pkt2  { animation-delay: -1.2s; }
    .pkt3  { animation-delay: -2.4s; }
    .ping  { animation: ping 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .dot   { animation: rise 6s ease-in infinite; }
    .d2 { animation-duration: 7s;   animation-delay: -1.5s; }
    .d3 { animation-duration: 5.5s; animation-delay: -3s; }
    .d4 { animation-duration: 8s;   animation-delay: -4.5s; }
    .d5 { animation-duration: 6.5s; animation-delay: -2.2s; }
    .d6 { animation-duration: 7.5s; animation-delay: -5.2s; }
    .type  { animation: type 7.5s steps(28, end) infinite backwards; transform-box: fill-box; transform-origin: left center; }
    .t2 { animation-delay: 0.3s; }
    .t3 { animation-delay: 0.6s; }
    .t4 { animation-delay: 0.9s; }
    .t5 { animation-delay: 1.2s; }
    .prog  { animation: prog 7.5s linear infinite; transform-box: fill-box; transform-origin: left center; }
    /* Each row types in, stays, then clears just before the next review. */
    @keyframes type { 0% { transform: scaleX(0); } 14%, 92% { transform: scaleX(1); } 97%, 100% { transform: scaleX(0); } }
    @keyframes prog { 0% { transform: scaleX(0); } 90% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
    @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
    @keyframes pulse   { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes drift   { from { transform: translate(0, 0); } to { transform: translate(-40px, -40px); } }
    @keyframes blink   { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    /* A red band sweeps across the name, then rests off-screen. */
    @keyframes shine   { 0% { transform: translateX(-200px); } 55%, 100% { transform: translateX(760px); } }
    /* Packets run along the pipeline: right, up, then into the review table. */
    @keyframes flow {
      0%   { transform: translate(0, 0);         opacity: 0; }
      6%   { opacity: 1; }
      70%  { transform: translate(648px, 0); }
      90%  { transform: translate(648px, -112px); opacity: 1; }
      100% { transform: translate(688px, -112px); opacity: 0; }
    }
    @keyframes ping { 0% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(3.2); opacity: 0; } }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 0.9; } 100% { transform: translateY(-260px); opacity: 0; } }
    /* The highlight walks down the five rows and pauses on each one. */
    @keyframes scan {
      0%, 14%   { transform: translateY(-56px); }
      20%, 34%  { transform: translateY(-28px); }
      40%, 60%  { transform: translateY(0); }
      66%, 80%  { transform: translateY(28px); }
      86%, 100% { transform: translateY(56px); }
    }
    /* The RISK pill turns red only while the highlight sits on the risky row. */
    @keyframes risk {
      0%, 38%, 62%, 100% { fill: #ffffff; fill-opacity: 0.18; }
      40%, 60%           { fill: #d42a4a; fill-opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .glow, .light, .grid, .scan, .pill, .caret, .shine, .pkt, .ping, .dot, .type, .prog { animation: none; }
      .shine, .pkt, .ping, .dot { opacity: 0; }
    }
  </style>
  <defs>
    <radialGradient id="glow" cx="1080" cy="380" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c8173a" stop-opacity="0.6"/>
      <stop offset="0.45" stop-color="#7a0d24" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0b0b0d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spill" cx="96" cy="180" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c8173a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#c8173a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.2" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2455f" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff5a75" stop-opacity="1"/>
      <stop offset="1" stop-color="#e2455f" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pktGlow">
      <stop offset="0" stop-color="#ff5a75" stop-opacity="1"/>
      <stop offset="1" stop-color="#d42a4a" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask">
      <rect width="1280" height="360" fill="url(#fade)"/>
    </mask>
    <clipPath id="nameClip">
      <text x="108" y="200" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-1.5">Israel Adeleye</text>
    </clipPath>
    <clipPath id="r1"><rect class="type"    x="20" y="56"  width="360" height="22"/></clipPath>
    <clipPath id="r2"><rect class="type t2" x="20" y="84"  width="360" height="22"/></clipPath>
    <clipPath id="r3"><rect class="type t3" x="20" y="110" width="360" height="24"/></clipPath>
    <clipPath id="r4"><rect class="type t4" x="20" y="140" width="360" height="22"/></clipPath>
    <clipPath id="r5"><rect class="type t5" x="20" y="168" width="360" height="22"/></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="#0b0b0d"/>
  <rect class="glow" width="1280" height="360" fill="url(#glow)"/>
  <rect width="1280" height="360" fill="url(#spill)"/>
  <g mask="url(#gridMask)">
    <rect class="grid" width="1360" height="440" fill="url(#grid)"/>
  </g>

  <!-- Rising particles in the glow -->
  <g fill="#ff5a75">
    <circle class="dot"    cx="900"  cy="350" r="2"/>
    <circle class="dot d2" cx="970"  cy="360" r="1.5"/>
    <circle class="dot d3" cx="1040" cy="345" r="2.5"/>
    <circle class="dot d4" cx="1110" cy="360" r="1.5"/>
    <circle class="dot d5" cx="1170" cy="350" r="2"/>
    <circle class="dot d6" cx="1230" cy="360" r="1.5"/>
  </g>

  <!-- Corner marks -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5">
    <path d="M24 44V24H44"/>
    <path d="M1236 24H1256V44"/>
    <path d="M24 316V336H44"/>
    <path d="M1236 336H1256V316"/>
  </g>

  <!-- Pipeline from the text into the review table, with packets flowing along it -->
  <path d="M112 312H760V200H800" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
  <g>
    <circle class="pkt"      cx="112" cy="312" r="9" fill="url(#pktGlow)"/>
    <circle class="pkt pkt2" cx="112" cy="312" r="9" fill="url(#pktGlow)"/>
    <circle class="pkt pkt3" cx="112" cy="312" r="9" fill="url(#pktGlow)"/>
  </g>

  <!-- Review table: header, rows, and a highlight that scans each row -->
  <g transform="translate(800 78)">
    <rect width="400" height="204" rx="12" fill="#121215" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.08"/>
    <g fill="#ffffff" fill-opacity="0.3" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="11" letter-spacing="2">
      <text x="24" y="32">STATEMENT</text>
      <text x="236" y="32">RISK</text>
      <text x="310" y="32">CONF.</text>
    </g>
    <!-- Live indicator -->
    <circle class="ping" cx="372" cy="28" r="3.5" fill="#d42a4a"/>
    <circle cx="372" cy="28" r="3.5" fill="#d42a4a"/>
    <rect x="24" y="44" width="352" height="1" fill="#ffffff" fill-opacity="0.08"/>
    <!-- Scanning highlight (behind the rows) -->
    <g class="scan">
      <rect x="12" y="108" width="376" height="28" rx="6" fill="#d42a4a" fill-opacity="0.12"/>
      <rect x="12" y="108" width="3" height="28" fill="#d42a4a"/>
    </g>
    <!-- Rows: each one types itself in, one after another -->
    <g font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12">
      <g clip-path="url(#r1)">
        <text x="24" y="70" fill="#e7e5e4" fill-opacity="0.75">SELECT id, email FROM users</text>
        <text x="236" y="70" fill="#8f8a86">LOW</text>
        <text x="310" y="70" fill="#e7e5e4" fill-opacity="0.6">98%</text>
      </g>
      <g clip-path="url(#r2)">
        <text x="24" y="98" fill="#e7e5e4" fill-opacity="0.75">UPDATE orders SET status=?</text>
        <text x="236" y="98" fill="#d9a441">MEDIUM</text>
        <text x="310" y="98" fill="#e7e5e4" fill-opacity="0.6">91%</text>
      </g>
      <g clip-path="url(#r3)">
        <text x="24" y="126" fill="#ff5a75">DELETE FROM payments;</text>
        <rect class="pill" x="236" y="114" width="62" height="16" rx="8" fill="#d42a4a"/>
        <text x="267" y="125.5" fill="#ffffff" font-size="9.5" font-weight="700" letter-spacing="0.5" text-anchor="middle">CRITICAL</text>
        <text x="310" y="126" fill="#e7e5e4" fill-opacity="0.85">99%</text>
      </g>
      <g clip-path="url(#r4)">
        <text x="24" y="154" fill="#e7e5e4" fill-opacity="0.75">ALTER TABLE customers ADD</text>
        <text x="236" y="154" fill="#e2455f">HIGH</text>
        <text x="310" y="154" fill="#e7e5e4" fill-opacity="0.6">86%</text>
      </g>
      <g clip-path="url(#r5)">
        <text x="24" y="182" fill="#e7e5e4" fill-opacity="0.75">CREATE INDEX idx_email</text>
        <text x="236" y="182" fill="#8f8a86">LOW</text>
        <text x="310" y="182" fill="#e7e5e4" fill-opacity="0.6">95%</text>
      </g>
    </g>
    <!-- Review progress bar -->
    <rect x="24" y="194" width="352" height="2" rx="1" fill="#ffffff" fill-opacity="0.06"/>
    <rect class="prog" x="24" y="194" width="352" height="2" rx="1" fill="#d42a4a"/>
  </g>

  <!-- One red light -->
  <rect class="light" x="80" y="100" width="4" height="160" fill="#d42a4a"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="112" y="128" fill="#d42a4a" font-size="18" font-weight="600" letter-spacing="5">DATABASE ENGINEERING</text>
    <text x="108" y="200" fill="#f5f5f4" font-size="76" font-weight="700" letter-spacing="-1.5">Israel Adeleye</text>
    <text x="112" y="240" fill="#b8b2ad" font-size="28">Cloud Database Engineer · SQL safety tooling</text>
  </g>
  <!-- Shine sweeping across the name -->
  <g clip-path="url(#nameClip)">
    <rect class="shine" x="0" y="120" width="180" height="100" fill="url(#band)"/>
  </g>
  <text x="112" y="270" fill="#ffffff" fill-opacity="0.38" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="16" letter-spacing="1">MySQL · PostgreSQL · SQL Server</text>
  <rect class="caret" x="424" y="257" width="9" height="17" fill="#d42a4a"/>
</svg>
