<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Israel Adeleye</title>
  <desc id="desc">Cloud Database Engineer · SQL safety tooling</desc>
  <defs>
    <radialGradient id="glow" cx="1120" cy="300" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c8173a" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#7a0d24" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0b0b0d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask">
      <rect width="1280" height="320" fill="url(#fade)"/>
    </mask>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="#0b0b0d"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <rect width="1280" height="320" fill="url(#grid)" mask="url(#gridMask)"/>

  <!-- Table rows: a quiet data motif on the right -->
  <g fill="#ffffff" fill-opacity="0.07">
    <rect x="860" y="96" width="280" height="10" rx="2"/>
    <rect x="860" y="124" width="220" height="10" rx="2"/>
    <rect x="860" y="152" width="250" height="10" rx="2"/>
    <rect x="860" y="208" width="190" height="10" rx="2"/>
    <rect x="860" y="236" width="235" height="10" rx="2"/>
  </g>
  <rect x="860" y="180" width="300" height="10" rx="2" fill="#d42a4a" fill-opacity="0.85"/>
  <rect x="836" y="180" width="10" height="10" rx="2" fill="#d42a4a"/>

  <!-- One red light -->
  <rect x="80" y="104" width="4" height="112" fill="#d42a4a"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="112" y="132" fill="#d42a4a" font-size="18" font-weight="600" letter-spacing="5">DATABASE ENGINEERING</text>
    <text x="110" y="190" fill="#f5f5f4" font-size="60" font-weight="700" letter-spacing="-1">Israel Adeleye</text>
    <text x="112" y="230" fill="#a8a29e" font-size="24" letter-spacing="0.5">Cloud Database Engineer · SQL safety tooling</text>
  </g>
</svg>
