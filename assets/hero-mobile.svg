<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
  <title id="title">Israel Adeleye</title>
  <desc id="desc">Database engineering. Cloud Database Engineer · SQL safety tooling. MySQL · PostgreSQL · SQL Server.</desc>
  <style>
    .glow  { animation: breathe 6s ease-in-out infinite; }
    .light { animation: pulse 2.4s ease-in-out infinite; }
    .grid  { animation: drift 8s linear infinite; }
    .scan  { animation: scan 6s ease-in-out infinite; }
    .pill  { animation: risk 6s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    @keyframes pulse   { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes drift   { from { transform: translate(0, 0); } to { transform: translate(-40px, -40px); } }
    /* The highlight walks down the three rows and pauses on each one. */
    @keyframes scan {
      0%, 25%   { transform: translateY(-38px); }
      33%, 66%  { transform: translateY(0); }
      75%, 100% { transform: translateY(38px); }
    }
    /* The RISK pill turns red only while the highlight sits on the risky row. */
    @keyframes risk {
      0%, 31%, 68%, 100% { fill: #ffffff; fill-opacity: 0.18; }
      33%, 66%           { fill: #d42a4a; fill-opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .glow, .light, .grid, .scan, .pill { animation: none; }
    }
  </style>
  <defs>
    <radialGradient id="glow" cx="700" cy="600" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c8173a" stop-opacity="0.6"/>
      <stop offset="0.45" stop-color="#7a0d24" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0b0b0d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask">
      <rect width="800" height="560" fill="url(#fade)"/>
    </mask>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="560" fill="#0b0b0d"/>
  <rect class="glow" width="800" height="560" fill="url(#glow)"/>
  <g mask="url(#gridMask)">
    <rect class="grid" width="880" height="640" fill="url(#grid)"/>
  </g>

  <!-- Corner marks -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2">
    <path d="M28 52V28H52"/>
    <path d="M748 28H772V52"/>
    <path d="M28 508V532H52"/>
    <path d="M748 532H772V508"/>
  </g>

  <!-- One red light -->
  <rect class="light" x="64" y="72" width="6" height="216" fill="#d42a4a"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="100" y="104" fill="#d42a4a" font-size="26" font-weight="600" letter-spacing="6">DATABASE ENGINEERING</text>
    <text x="96" y="186" fill="#f5f5f4" font-size="80" font-weight="700" letter-spacing="-1.5">Israel Adeleye</text>
    <text x="100" y="236" fill="#b8b2ad" font-size="34">Cloud Database Engineer</text>
    <text x="100" y="280" fill="#b8b2ad" font-size="34">SQL safety tooling</text>
  </g>

  <!-- Compact review table: three rows and a scanning highlight -->
  <g transform="translate(64 328)">
    <rect width="672" height="176" rx="16" fill="#121215" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.08"/>
    <g fill="#ffffff" fill-opacity="0.35" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="18" letter-spacing="2">
      <text x="32" y="42">STATEMENT</text>
      <text x="400" y="42">RISK</text>
      <text x="530" y="42">CONF.</text>
    </g>
    <rect x="32" y="58" width="608" height="1" fill="#ffffff" fill-opacity="0.08"/>
    <g fill="#ffffff" fill-opacity="0.1">
      <rect x="32" y="74" width="260" height="12" rx="3"/><rect x="400" y="74" width="70" height="12" rx="3"/><rect x="530" y="74" width="80" height="12" rx="3"/>
      <rect x="32" y="150" width="210" height="12" rx="3"/><rect x="400" y="150" width="60" height="12" rx="3"/><rect x="530" y="150" width="70" height="12" rx="3"/>
    </g>
    <!-- The risky row -->
    <rect x="32" y="112" width="300" height="12" rx="3" fill="#d42a4a" fill-opacity="0.9"/>
    <rect class="pill" x="400" y="109" width="84" height="18" rx="9" fill="#d42a4a"/>
    <rect x="530" y="112" width="74" height="12" rx="3" fill="#ffffff" fill-opacity="0.35"/>
    <!-- Scanning highlight -->
    <g class="scan">
      <rect x="16" y="98" width="640" height="40" rx="8" fill="#d42a4a" fill-opacity="0.12"/>
      <rect x="16" y="98" width="4" height="40" fill="#d42a4a"/>
    </g>
  </g>
</svg>
